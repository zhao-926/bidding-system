# 部署到 GitHub Pages：push 到 main 時，先跑全部測試，通過後才發布 web/。
# 網頁是純靜態的 JavaScript 版（不需要編譯），所以直接上傳 web/ 資料夾。
# Pages 的來源已在 Settings → Pages 設為「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: C++ 單元測試
        run: make test
      - name: 檢查 core/ 與 web/js/core/ 沒有使用內建容器
        run: make check
      - name: JS 核心測試（含與 C++ 範例資料逐位元組比對）
        run: make test-js
      - name: 檢查網頁檔案與相對路徑
        run: bash scripts/build_web.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
